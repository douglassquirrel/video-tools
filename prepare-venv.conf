# What lobster-tools' prepare-venv needs to know about video-tools; setup-linux runs it with this checkout as
# --project (README, "Running from the Linux device shell"). KEY=value lines, read by prepare-venv, never run.
ENV_PREFIX=VIDEO_TOOLS
REQUIREMENTS=requirements.txt
IMPORTS=numpy soundfile kokoro_onnx PIL
MODEL_FILES=model.onnx voices.npz
MODEL_SETTING=SPEECH_MODEL_DIR
MODEL_HELP=the README's "One-time set-up of the speech model"
