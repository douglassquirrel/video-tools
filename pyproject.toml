# Dev tooling only. The commands' own packages are in requirements.txt; cut-video needs none.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=videotools --cov-report=term-missing"

[tool.coverage.run]
branch = true
# Most Tier 2 tests call each command inside the test; the few that start it as a program (conftest.run_program)
# are measured by coverage.py's .pth hook, when COVERAGE_PROCESS_START names this file (conftest sets it for
# those runs only) and parallel is on.
parallel = true
source = ["videotools"]

[tool.ruff]
target-version = "py39"
line-length = 100
